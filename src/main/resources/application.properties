spring.application.name=smart-campus
spring.datasource.url=jdbc:h2:mem:smartcampus;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8081
spring.mvc.hiddenmethod.filter.enabled=true

# Default admin account creation
app.admin.email=admin@smartcampus.edu
app.admin.password=Admin@123
app.admin.name=System Administrator
